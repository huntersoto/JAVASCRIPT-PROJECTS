<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
    </head>
    <body>
        <p id="Counting_to_Ten"></p>
        <button onclick="count_To_Ten()">Click to start counting</button>
        <script>
            function count_To_Ten() {
                var Digit = "";
                var X = 1;
                while (X < 11) {
                    Digit += "<br>" + X;
                    X++;
                }
                document.getElementById("Counting_to_Ten").innerHTML = Digit;
            }
        </script>
    </body>
</html>
